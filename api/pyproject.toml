[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aptus-api"
version = "0.1.0"
description = "Aptus backend API — self-serve capability assessment for institutions"
requires-python = ">=3.10"
dependencies = [
    # aptus-engine is a path dependency in this repository; install it
    # with `pip install -e ../engine` before installing this package.
    "aptus-engine",
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

# The item bank is package data. Without this it is present in a source
# checkout and absent from an installed deployment, which fails only
# once a candidate opens an assessment.
[tool.setuptools.package-data]
aptus_api = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
