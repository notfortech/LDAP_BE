# Local PostgreSQL for development and for running the row-level-security
# tests, which cannot run on SQLite.
#
#   docker compose up -d
#   ./scripts/setup-db.sh
#   cd api && pytest
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aptus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - aptus_pgdata:/var/lib/postgresql/data

volumes:
  aptus_pgdata:
